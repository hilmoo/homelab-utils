# router-HA config. Every key is optional; the values below are the defaults
# (except the empty secrets). Durations use Go syntax: 10s, 2m, 1h30m.

# --- watch ---
ping_host: 192.168.1.4
ping_interval: 10s
ping_timeout: 2s
fallback: 2m            # host must stay unreachable this long before shutdown starts

# --- notification ---
discord_webhook: ""     # empty = skip

# --- proxmox guests ---
keep_ids: []            # VM/LXC IDs that are NOT shut down, e.g. [100, 101]
guest_wait: 3m
guest_force: true       # force stop guests still running after guest_wait

# --- router (F6201B) ---
router_url: http://192.168.1.1
router_user: admin
router_pass: ""
ssids: [1, 5]           # turned on during an outage, off again after start
ssid_off_after: 5m      # after app start, wait this long then turn ssids off

# --- device with /on and /off ---
plug_url: http://192.168.1.3
on_retry: 5s            # retry interval for the startup /on and ssid-off jobs
off_delay: 5m           # wait between enabling ssids and sending /off
off_retry: 5s
off_tries: 5
http_timeout: 10s

# --- final step ---
shutdown_cmd: systemctl poweroff
dry_run: false
