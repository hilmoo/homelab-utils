version: 2

project_name: router-ha

before:
  hooks:
    - go mod tidy

builds:
  - id: router-ha
    main: ./cmd/router-ha
    binary: router-ha
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - README.md
      - config.example.yaml

checksum:
  name_template: checksums.txt

changelog:
  disable: true
